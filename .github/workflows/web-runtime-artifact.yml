name: Web Runtime Artifact

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths: ['apps/web/**', '.github/workflows/web-runtime-artifact.yml']
  push:
    branches: [develop]
    paths: ['apps/web/**', '.github/workflows/web-runtime-artifact.yml']

permissions:
  contents: read

concurrency:
  group: web-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build and typecheck
        working-directory: apps/web
        run: |
          npx vitest run tests/build-guard.test.mjs
          npm run build
          npm run typecheck
      - name: Package runtime without credentials or build cache
        run: |
          mkdir web-runtime-artifact
          tar -C apps/web --exclude='.next/cache' -czf web-runtime-artifact/web-runtime.tar.gz .next
          cp apps/web/.next/BUILD_ID web-runtime-artifact/BUILD_ID
          printf '%s\n' "$GITHUB_SHA" > web-runtime-artifact/COMMIT
          sha256sum apps/web/package-lock.json > web-runtime-artifact/PACKAGE_LOCK_SHA256
          cd web-runtime-artifact
          sha256sum web-runtime.tar.gz > SHA256SUMS
      - name: Record artifact source and integrity manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, platform, subprocess
          from pathlib import Path
          assert platform.system() == 'Linux' and platform.machine() == 'x86_64'
          root = Path('web-runtime-artifact')
          manifest = {
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'web_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD:apps/web'], text=True).strip(),
              'archive_name': 'web-runtime.tar.gz',
              'sha256': hashlib.sha256((root/'web-runtime.tar.gz').read_bytes()).hexdigest(),
              'package_lock_sha256': hashlib.sha256(Path('apps/web/package-lock.json').read_bytes()).hexdigest(),
              'build_id': Path('apps/web/.next/BUILD_ID').read_text().strip(),
              'platform': 'linux/amd64',
          }
          (root/'linux-build-manifest.json').write_text(json.dumps(manifest, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: web-runtime-${{ github.sha }}
          path: web-runtime-artifact/
          if-no-files-found: error
          retention-days: 7
