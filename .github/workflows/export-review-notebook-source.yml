name: Export Review Notebook Source
on:
  push:
    branches: [codex/company-review-notebook-v1]
    paths: [.github/workflows/export-review-notebook-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked code only
        run: |
          mkdir -p /tmp/review-notebook-source
          git archive --format=tar.gz HEAD apps/web docs/api/frontend docs/tasks/company-review-notebook-v1 src/stockanalysis/frontend AGENTS.md .github/workflows/web-product-quality.yml > /tmp/review-notebook-source/source.tar.gz
          git rev-parse HEAD > /tmp/review-notebook-source/commit.txt
          sha256sum /tmp/review-notebook-source/source.tar.gz > /tmp/review-notebook-source/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: review-notebook-source
          path: /tmp/review-notebook-source/
          retention-days: 3
