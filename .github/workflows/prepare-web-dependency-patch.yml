name: Prepare Web Dependency Patch
on:
  push:
    branches: ['codex/web-dependency-remediation-v1']
    paths: ['.github/workflows/prepare-web-dependency-patch.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'gwkim92/stockA' && github.ref == 'refs/heads/codex/web-dependency-remediation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce audit and resolve bounded patch without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-patch"
          cd apps/web
          cp package.json "$RUNNER_TEMP/web-patch/package-before.json"
          cp package-lock.json "$RUNNER_TEMP/web-patch/lock-before.json"
          npm audit --package-lock-only --json > "$RUNNER_TEMP/web-patch/audit-before.json" || test "$?" -eq 1
          npm view next@16.3.4 version dependencies optionalDependencies peerDependencies engines --json > "$RUNNER_TEMP/web-patch/upstream-next.json"
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.dependencies.next !== '16.2.9') throw Error('Unexpected baseline');
          p.dependencies.next = '16.3.4';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit
          npm update --package-lock-only --ignore-scripts --no-audit brace-expansion browserslist fast-uri nanoid postcss undici
          npm audit --package-lock-only --json > "$RUNNER_TEMP/web-patch/audit-after.json" || test "$?" -eq 1
          npm audit --package-lock-only --omit=dev --json > "$RUNNER_TEMP/web-patch/audit-production.json" || test "$?" -eq 1
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const dir = process.env.RUNNER_TEMP + '/web-patch';
          const before = JSON.parse(fs.readFileSync(dir + '/package-before.json'));
          const after = JSON.parse(fs.readFileSync('package.json'));
          before.dependencies.next = '16.3.4';
          if (JSON.stringify(before) !== JSON.stringify(after)) throw Error('Unrelated direct dependency change');
          const oldLock = JSON.parse(fs.readFileSync(dir + '/lock-before.json')).packages;
          const lock = JSON.parse(fs.readFileSync('package-lock.json')).packages;
          const changes = [...new Set([...Object.keys(oldLock), ...Object.keys(lock)])].sort().flatMap(path => {
            const a = oldLock[path], b = lock[path];
            return JSON.stringify(a) === JSON.stringify(b) ? [] : [{path, from: a?.version ?? null, to: b?.version ?? null, dev: b?.dev ?? false}];
          });
          fs.writeFileSync(dir + '/lock-changes.json', JSON.stringify(changes, null, 2));
          const audit = JSON.parse(fs.readFileSync(dir + '/audit-after.json'));
          if (!audit.metadata || audit.error) throw Error('Audit could not complete');
          console.log(JSON.stringify({vulnerabilities: audit.metadata.vulnerabilities, changedEntries: changes.length}));
          if (audit.metadata.vulnerabilities.high || audit.metadata.vulnerabilities.critical) throw Error('High/critical advisories remain; do not publish');
          JS
          git diff --check
      - name: Commit only the reviewed dependency surface to the task branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/web-dependency-remediation-v1'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          assert set(paths) <= {'apps/web/package.json','apps/web/package-lock.json'}, paths
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json apps/web/package-lock.json
          git commit -m 'fix(deps): patch Next and affected transitive dependencies'
          gh auth setup-git
          git push origin HEAD:refs/heads/codex/web-dependency-remediation-v1
          git rev-parse HEAD > "$RUNNER_TEMP/web-patch/commit.txt"
          git archive --format=tar.gz HEAD apps/web > "$RUNNER_TEMP/web-patch/web-source.tar.gz"
      - name: Preserve exact source and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dependency-patch-evidence
          path: ${{ runner.temp }}/web-patch/
          retention-days: 7
