name: Web Product Quality

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'scripts/verify_evaluation_history_browser.mjs'
      - 'src/stockanalysis/frontend/live_adapter.py'
      - 'src/stockanalysis/frontend/research_display_contract.py'
      - 'tests/test_research_display*.py'
      - 'tests/test_frontend_live_adapter.py'
      - 'scripts/verify_research_display_contract.py'
      - 'docs/tasks/research-payload-contract-v1/**'
      - '.github/workflows/web-product-quality.yml'
      - 'docs/tasks/investor-home-reliability-v1/**'
      - 'docs/tasks/web-dependency-remediation-v1/**'
      - 'docs/tasks/recommendation-investment-memo-v1/**'
      - 'docs/tasks/research-workspace-redesign-v1/**'
      - 'docs/tasks/research-discovery-workspace-v1/**'
      - 'docs/tasks/portfolio-performance-workspace-v1/**'
      - 'docs/tasks/thesis-source-reader-v1/**'
      - 'docs/tasks/company-evidence-workspace-v1/**'
      - 'docs/tasks/news-theme-triage-v1/**'
      - 'docs/tasks/company-review-notebook-v1/**'
      - 'docs/api/frontend/examples/stock-list.json'
      - 'docs/api/frontend/examples/cycle-state-list.json'
      - 'docs/api/frontend/examples/market-map.json'
      - 'docs/api/frontend/examples/portfolio-coverage.json'
      - 'docs/api/frontend/examples/performance-outcomes.json'
      - 'docs/api/frontend/examples/thesis-detail.json'
      - 'docs/api/frontend/examples/source-document-detail.json'
      - 'docs/api/frontend/examples/stock-detail.json'
      - 'docs/api/frontend/examples/stock-detail-spy.json'
      - 'docs/api/frontend/examples/ai-evidence-detail.json'
      - 'docs/api/frontend/examples/event-list.json'
      - 'docs/api/frontend/examples/theme-detail.json'
  push:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - 'scripts/verify_evaluation_history_browser.mjs'
      - 'src/stockanalysis/frontend/live_adapter.py'
      - 'src/stockanalysis/frontend/research_display_contract.py'
      - 'tests/test_research_display*.py'
      - 'tests/test_frontend_live_adapter.py'
      - 'scripts/verify_research_display_contract.py'
      - 'docs/tasks/research-payload-contract-v1/**'
      - '.github/workflows/web-product-quality.yml'
      - 'docs/tasks/investor-home-reliability-v1/**'
      - 'docs/tasks/web-dependency-remediation-v1/**'
      - 'docs/tasks/recommendation-investment-memo-v1/**'
      - 'docs/tasks/research-workspace-redesign-v1/**'
      - 'docs/tasks/research-discovery-workspace-v1/**'
      - 'docs/tasks/portfolio-performance-workspace-v1/**'
      - 'docs/tasks/thesis-source-reader-v1/**'
      - 'docs/tasks/company-evidence-workspace-v1/**'
      - 'docs/tasks/news-theme-triage-v1/**'
      - 'docs/tasks/company-review-notebook-v1/**'
      - 'docs/api/frontend/examples/stock-list.json'
      - 'docs/api/frontend/examples/cycle-state-list.json'
      - 'docs/api/frontend/examples/market-map.json'
      - 'docs/api/frontend/examples/portfolio-coverage.json'
      - 'docs/api/frontend/examples/performance-outcomes.json'
      - 'docs/api/frontend/examples/thesis-detail.json'
      - 'docs/api/frontend/examples/source-document-detail.json'
      - 'docs/api/frontend/examples/stock-detail.json'
      - 'docs/api/frontend/examples/stock-detail-spy.json'
      - 'docs/api/frontend/examples/ai-evidence-detail.json'
      - 'docs/api/frontend/examples/event-list.json'
      - 'docs/api/frontend/examples/theme-detail.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-product-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit all dependencies (high and critical block CI)
        run: npm audit --audit-level=high --json > dependency-audit.json
      - name: Audit production dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high --json > dependency-audit-production.json
      - name: Python display and existing adapter regression without external IO
        working-directory: .
        env:
          OPENAI_AGENTS_DISABLE_TRACING: '1'
        run: |
          set -o pipefail
          python3 scripts/verify_research_display_contract.py 2>&1 | tee research-display-tests.log
      - name: Frontend unit regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Type check including generated routes
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Company review notebook browser verification
        run: npx playwright test --config=playwright.notebook.config.ts
      - name: Evaluation history browser verification
        working-directory: .
        run: node scripts/verify_evaluation_history_browser.mjs
      - name: Investor browser verification
        run: npx playwright test --config=playwright.home.config.ts
      - name: Holdings and outcomes browser verification
        run: npx playwright test --config=playwright.review.config.ts
      - name: Thesis and source reading browser verification
        run: npx playwright test --config=playwright.readers.config.ts
      - name: Company and evidence browser verification
        run: npx playwright test --config=playwright.company.config.ts
      - name: Research automation operations browser verification
        run: npx playwright test --config=playwright.operations.config.ts
      - name: News triage and theme browser verification
        run: npx playwright test --config=playwright.signals.config.ts
      - name: Preserve browser and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-home-browser-evidence
          path: |
            research-display-report.json
            research-display-tests.log
            apps/web/test-results/home/
            apps/web/playwright-home-report/
            apps/web/test-results/review/
            apps/web/playwright-review-report/
            apps/web/test-results/readers/
            apps/web/playwright-readers-report/
            apps/web/test-results/company/
            apps/web/test-results/operations/
            apps/web/playwright-company-report/
            apps/web/test-results/signals/
            apps/web/playwright-signals-report/
            apps/web/test-results/notebook/
            apps/web/playwright-notebook-report/
            apps/web/dependency-audit.json
            apps/web/dependency-audit-production.json
            artifacts/evaluation-history/browser/
          if-no-files-found: ignore
          retention-days: 7
