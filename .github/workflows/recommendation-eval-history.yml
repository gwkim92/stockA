name: Evaluation History

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/stockanalysis/frontend/**'
      - 'src/stockanalysis/operations/recommendation_eval_persistence.py'
      - 'db/migrations/**'
      - 'tests/test_recommendation_eval_history*.py'
      - 'tests/test_frontend_api_server.py'
      - 'tests/test_evaluation_history_completion.py'
      - '.github/workflows/recommendation-eval-history.yml'
      - 'pyproject.toml'
  push:
    branches: [develop]
    paths:
      - 'src/stockanalysis/frontend/**'
      - 'src/stockanalysis/operations/recommendation_eval_persistence.py'
      - 'db/migrations/**'
      - 'tests/test_recommendation_eval_history*.py'
      - 'tests/test_frontend_api_server.py'
      - 'tests/test_evaluation_history_completion.py'
      - '.github/workflows/recommendation-eval-history.yml'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stockanalysis_eval_history_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockanalysis_eval_history_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: src
      STOCKANALYSIS_EVAL_HISTORY_CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing backend dependencies
        run: python -m pip install -e .
      - name: Existing analysis and operations CLI regression
        run: bash scripts/verify_analysis_integrity_ci.sh
      - name: History unit HTTP and PostgreSQL tests
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import sys
          import unittest
          from pathlib import Path

          from psycopg import __version__ as psycopg_version

          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('STOCKANALYSIS_EVAL_HISTORY_CI') == '1'
          names = [
              'tests.test_evaluation_history_completion',
              'tests.test_recommendation_eval_history',
              'tests.test_recommendation_eval_history_postgres',
              'tests.test_frontend_api_server',
          ]
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          report = {
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'python': platform.python_version(),
              'psycopg': psycopg_version,
              'modules': names,
              'tests_run': result.testsRun,
              'failures': len(result.failures),
              'errors': len(result.errors),
              'skipped': len(result.skipped),
              'database': 'fixed_loopback_disposable_service',
              'production_database_access': False,
              'live_model_calls': False,
          }
          out = Path('artifacts/evaluation-history')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'result.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, sort_keys=True))
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
      - name: Check committed diff whitespace
        run: git diff --check HEAD^ HEAD
      - name: Retain test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-history-results
          path: artifacts/evaluation-history/
          if-no-files-found: error
