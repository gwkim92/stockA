name: Evaluation History Read Contract

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/stockanalysis/frontend/recommendation_eval_history.py'
      - 'src/stockanalysis/frontend/api_adapter.py'
      - 'src/stockanalysis/frontend/api_server.py'
      - 'tests/test_eval_history_read_contract.py'
      - 'scripts/verify_eval_history_read_postgres.py'
      - 'db/migrations/**'
      - '.github/workflows/eval-history-read-contract.yml'
  push:
    branches: [develop]
    paths:
      - 'src/stockanalysis/frontend/recommendation_eval_history.py'
      - 'src/stockanalysis/frontend/api_adapter.py'
      - 'src/stockanalysis/frontend/api_server.py'
      - 'tests/test_eval_history_read_contract.py'
      - 'scripts/verify_eval_history_read_postgres.py'
      - 'db/migrations/**'
      - '.github/workflows/eval-history-read-contract.yml'

permissions:
  contents: read

concurrency:
  group: eval-history-read-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: eval_history_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d eval_history_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      STOCKANALYSIS_TEST_POSTGRES_DSN: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/eval_history_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: History parser, SQL and authenticated HTTP regression
        run: python -m unittest tests.test_eval_history_read_contract -v
      - name: Existing analysis and operations regression
        run: bash scripts/verify_analysis_integrity_ci.sh
      - name: Apply actual migrations to disposable CI database only
        shell: bash
        run: |
          set -euo pipefail
          for migration in db/migrations/*.sql; do
            psql "$STOCKANALYSIS_TEST_POSTGRES_DSN" -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: SELECT-only PostgreSQL history integration
        run: python scripts/verify_eval_history_read_postgres.py
      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
