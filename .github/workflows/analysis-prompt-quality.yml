name: Analysis Prompt Quality

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'src/stockanalysis/ai_agents/**'
      - 'src/stockanalysis/ai/**'
      - 'src/stockanalysis/ingest/news/**'
      - 'src/stockanalysis/ingest/sec/ai_event_extract.py'
      - 'tests/test_*prompt*'
      - 'tests/test_agents_sdk_provider.py'
      - 'tests/test_ai_agent_registry.py'
      - 'tests/test_news*'
      - 'tests/test_cycle*'
      - 'tests/test_agent_market_context.py'
      - 'tests/test_ai_ontology_validation.py'
      - 'tests/test_equity_research_reporting.py'
      - 'tests/test_equity_research_contract_v3.py'
      - 'tests/test_equity_context_cutoff*'
      - 'tests/test_equity_batch_isolation.py'
      - 'tests/test_equity_atomic*'
      - 'tests/equity_persistence_fakes.py'
      - 'tests/fixtures/equity-cutoff-*.sql'
      - 'tests/test_sec_ai_event_extract.py'
      - 'scripts/verify_analysis_prompt_contract.py'
      - 'scripts/verify_equity_context_cutoff.py'
      - 'scripts/verify_equity_atomic_persistence.py'
      - 'docs/tasks/analysis-prompt-contract-v1/**'
      - 'docs/tasks/analysis-prompt-hardening-v2/**'
      - 'docs/tasks/equity-research-contract-v3/**'
      - 'docs/tasks/equity-context-cutoff-v1/**'
      - 'docs/tasks/equity-batch-isolation-v1/**'
      - 'docs/tasks/equity-atomic-persistence-v1/**'
      - 'pyproject.toml'
      - '.github/workflows/analysis-prompt-quality.yml'
  push:
    branches: [develop]
    paths:
      - 'src/stockanalysis/ai_agents/**'
      - 'src/stockanalysis/ai/**'
      - 'src/stockanalysis/ingest/news/**'
      - 'src/stockanalysis/ingest/sec/ai_event_extract.py'
      - 'tests/test_*prompt*'
      - 'tests/test_agents_sdk_provider.py'
      - 'tests/test_ai_agent_registry.py'
      - 'tests/test_news*'
      - 'tests/test_cycle*'
      - 'tests/test_agent_market_context.py'
      - 'tests/test_ai_ontology_validation.py'
      - 'tests/test_equity_research_reporting.py'
      - 'tests/test_equity_research_contract_v3.py'
      - 'tests/test_equity_context_cutoff*'
      - 'tests/test_equity_batch_isolation.py'
      - 'tests/test_equity_atomic*'
      - 'tests/equity_persistence_fakes.py'
      - 'tests/fixtures/equity-cutoff-*.sql'
      - 'tests/test_sec_ai_event_extract.py'
      - 'scripts/verify_analysis_prompt_contract.py'
      - 'scripts/verify_equity_context_cutoff.py'
      - 'scripts/verify_equity_atomic_persistence.py'
      - 'docs/tasks/analysis-prompt-contract-v1/**'
      - 'docs/tasks/analysis-prompt-hardening-v2/**'
      - 'docs/tasks/equity-research-contract-v3/**'
      - 'docs/tasks/equity-context-cutoff-v1/**'
      - 'docs/tasks/equity-batch-isolation-v1/**'
      - 'docs/tasks/equity-atomic-persistence-v1/**'
      - 'pyproject.toml'
      - '.github/workflows/analysis-prompt-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-prompt-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      OPENAI_AGENTS_DISABLE_TRACING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install declared package and optional SDK
        run: python -m pip install -e '.[agents]'
      - name: Compile changed runtime modules
        run: python -m compileall -q src/stockanalysis/ai_agents src/stockanalysis/ai src/stockanalysis/ingest/sec/ai_event_extract.py src/stockanalysis/ingest/news
      - name: Verify offline prompts and real SDK contract objects
        env:
          STOCKANALYSIS_AI_PROVIDER_HEALTH_PATH: ${{ runner.temp }}/prompt-test-provider-health.json
        shell: bash
        run: |
          set -o pipefail
          python scripts/verify_analysis_prompt_contract.py --require-sdk 2>&1 | tee prompt-contract-tests.log
      - name: Preserve exact test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-contract-python-${{ matrix.python-version }}
          path: |
            prompt-contract-report.json
            prompt-contract-tests.log
          retention-days: 7
          if-no-files-found: warn

  postgres-cutoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stocka_cutoff_test
          POSTGRES_PASSWORD: synthetic-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres -d stocka_cutoff_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute production SELECT against rollback-only fixtures
        env:
          STOCKA_CUTOFF_TEST_CONTAINER: ${{ job.services.postgres.id }}
          OPENAI_AGENTS_DISABLE_TRACING: '1'
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/verify_equity_context_cutoff.py 2>&1 | tee equity-cutoff-tests.log
      - name: Preserve SQL execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equity-cutoff-postgres
          path: |
            equity-cutoff-report.json
            equity-cutoff-tests.log
          retention-days: 7
          if-no-files-found: warn

  postgres-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stocka_atomic_test
          POSTGRES_PASSWORD: synthetic-ci-only
        options: >-
          --health-cmd "pg_isready -U postgres -d stocka_atomic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify committed writes, rollback and read-only reconciliation
        env:
          STOCKA_ATOMIC_TEST_CONTAINER: ${{ job.services.postgres.id }}
          OPENAI_AGENTS_DISABLE_TRACING: '1'
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/verify_equity_atomic_persistence.py 2>&1 | tee equity-atomic-tests.log
      - name: Preserve committed-write test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equity-atomic-postgres
          path: |
            equity-atomic-report.json
            equity-atomic-tests.log
          retention-days: 7
          if-no-files-found: warn
