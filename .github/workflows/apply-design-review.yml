name: Apply Reviewed Design
on:
  push:
    branches: [codex/research-workspace-redesign-v1]
    paths: [.github/workflows/apply-design-review.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/codex/research-workspace-redesign-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-workspace-redesign-v1
          fetch-depth: 0
      - name: Verify and apply reviewed source manifest
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          raw = lzma.decompress(base64.b64decode(''.join(Path(f'.design-transfer/part{i}.b64').read_text().strip() for i in (1, 2)), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'baf853c42a694a3490202fa8fb619f3505855cd3e7a3811e140201400176da76', 'transfer integrity mismatch'
          manifest = json.loads(raw)
          assert manifest['base'] == '3de180d259ce65787e307d85885b8524bf209d66'
          subprocess.run(['git', 'merge-base', '--is-ancestor', manifest['base'], 'HEAD'], check=True)
          changes = manifest['changes']
          assert len(changes) == 37
          paths = [c['path'] for c in changes]
          assert len(set(paths)) == len(paths)
          def digest(path):
              p = Path(path)
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          for c in changes:
              p = Path(c['path'])
              assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
              assert c['path'].startswith('apps/web/') or c['path'] == '.github/workflows/web-product-quality.yml'
              assert c['path'] not in ('apps/web/package.json', 'apps/web/package-lock.json')
              assert digest(c['path']) == c['before'], f"source changed: {c['path']}"
          for c in changes:
              p = Path(c['path'])
              if 'patch' in c:
                  subprocess.run(['git', 'apply', '--whitespace=error', '-'], input=c['patch'], text=True, check=True)
              elif c['content'] is None:
                  p.unlink()
              else:
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(c['content'], encoding='utf-8')
              assert digest(c['path']) == c['after'], f"result mismatch: {c['path']}"
          cleanup = ['.design-transfer/part1.b64', '.design-transfer/part2.b64', '.github/workflows/export-design-source.yml', '.github/workflows/apply-design-review.yml']
          for path in cleanup:
              Path(path).unlink()
          subprocess.run(['git', 'add', '-A', '--', *paths, *cleanup], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert staged == set(paths + cleanup), 'unexpected staged surface'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Commit reviewed redesign and remove temporary transfer tools
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(design): rebuild stockA as a responsive research workspace'
          git push origin HEAD:codex/research-workspace-redesign-v1
      - name: Export final tracked implementation for review
        run: |
          mkdir -p /tmp/design-result
          git archive --format=tar.gz HEAD apps/web .github/workflows/web-product-quality.yml docs/tasks/research-workspace-redesign-v1 > /tmp/design-result/source.tar.gz
          git rev-parse HEAD > /tmp/design-result/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-design-source
          path: /tmp/design-result/
          retention-days: 3
