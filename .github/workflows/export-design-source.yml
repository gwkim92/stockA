name: Export Design Source
on:
  push:
    branches: [codex/research-workspace-redesign-v1]
    paths: [.github/workflows/export-design-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: |
          mkdir -p /tmp/design-source
          git archive --format=tar.gz HEAD apps/web .github/workflows/web-product-quality.yml docs/project-foundation.md docs/tasks/research-workspace-redesign-v1 AGENTS.md > /tmp/design-source/source.tar.gz
          git rev-parse HEAD > /tmp/design-source/commit.txt
          sha256sum /tmp/design-source/source.tar.gz > /tmp/design-source/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: design-source
          path: /tmp/design-source/
          retention-days: 3
