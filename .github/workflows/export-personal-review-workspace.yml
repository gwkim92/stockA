name: Export Personal Review Workspace
on:
  push:
    branches: [codex/personal-review-inbox-v1]
    paths: [.github/workflows/export-personal-review-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install chromium
      - name: Export tracked source and test runtime only
        run: |
          mkdir -p /tmp/review-workspace
          git archive --format=tar.gz HEAD > /tmp/review-workspace/source.tar.gz
          tar -czf /tmp/review-workspace/node-modules.tar.gz -C apps/web node_modules
          tar -czf /tmp/review-workspace/browsers.tar.gz -C "$HOME/.cache" ms-playwright
          git rev-parse HEAD > /tmp/review-workspace/commit.txt
          cd /tmp/review-workspace && sha256sum *.tar.gz > sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: personal-review-workspace
          path: /tmp/review-workspace/
          compression-level: 0
          retention-days: 1
