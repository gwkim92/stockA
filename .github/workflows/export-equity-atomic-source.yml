name: Export Equity Atomic Source
on:
  push:
    branches: [codex/equity-atomic-persistence-v1]
    paths: [.github/workflows/export-equity-atomic-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: |
          mkdir -p /tmp/equity-atomic-source
          git archive --format=tar.gz HEAD src tests scripts db/migrations db/seeds docs/tasks/equity-atomic-persistence-v1 AGENTS.md pyproject.toml .github/workflows/analysis-prompt-quality.yml > /tmp/equity-atomic-source/source.tar.gz
          git rev-parse HEAD > /tmp/equity-atomic-source/commit.txt
          sha256sum /tmp/equity-atomic-source/source.tar.gz > /tmp/equity-atomic-source/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: equity-atomic-source
          path: /tmp/equity-atomic-source/
          retention-days: 3
