name: Export Company Evidence Source
on:
  push:
    branches: [codex/company-evidence-workspace-v1]
    paths: [.github/workflows/export-company-evidence-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: |
          mkdir -p /tmp/company-source
          git archive --format=tar.gz HEAD apps/web src/stockanalysis/frontend docs/api/frontend AGENTS.md docs/tasks/company-evidence-workspace-v1 .github/workflows/web-product-quality.yml > /tmp/company-source/source.tar.gz
          git rev-parse HEAD > /tmp/company-source/commit.txt
          sha256sum /tmp/company-source/source.tar.gz > /tmp/company-source/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: company-evidence-source
          path: /tmp/company-source/
          retention-days: 3
